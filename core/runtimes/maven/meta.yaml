name: maven
title: Java (Maven)
description: Maven projects (incl. multi-module). Quarkus profile — HCI_PROFILE=quarkus.
default_version: "21"
service_types: [image, library]
steps: [build, test, publish, image:build, image:scan, image:publish, cd:bump, cd:notify, deps:scan, sonar, svace, appscreener, kcs]
profiles: [quarkus]
versions:
  - id: "8"
    label: "8"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-8:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-8-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
  - id: "11"
    label: "11"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-11:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-11-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
  - id: "17"
    label: "17"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-17:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-17-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
  - id: "21"
    label: "21"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-21:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-21-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
  - id: "25"
    label: "25"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-25:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-25-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
images:
  sonar: build
  svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-maven-0.7.0"
ports: [8080, 8443]
schema:
  name: JDK
  buildTool: maven
cache:
  files: [pom.xml]
  paths: [.cache/m2]
artifacts: ["**/target", "**/pom.xml"]
reports:
  junit: ["**/target/surefire-reports/TEST-*.xml", "**/target/failsafe-reports/TEST-*.xml"]
  coverage:
    format: jacoco
    path: "**/target/site/jacoco/jacoco.xml"
