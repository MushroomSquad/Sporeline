name: nodejs
title: Node.js
description: npm, yarn, or pnpm (corepack). build/test/lint scripts come from package.json.
default_version: "22"
service_types: [image, library]
steps: [build, test, lint, publish, image:build, image:scan, image:publish, cd:bump, cd:notify, deps:scan, sonar, svace, appscreener, kcs]
versions:
  - id: "10"
    label: "10"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/ubi8/nodejs-10:1-127"
    runtime: "${HCI_REGISTRY_OCI_HOST}/ubi8/nodejs-10:1-127"
  - id: "12"
    label: "12"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/ubi8/nodejs-12:1-113"
    runtime: "${HCI_REGISTRY_OCI_HOST}/ubi8/nodejs-12:1-113"
  - id: "14"
    label: "14"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/ubi8/nodejs-14:1-111"
    runtime: "${HCI_REGISTRY_OCI_HOST}/ubi8/nodejs-14-minimal:1-97"
  - id: "16"
    label: "16"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/nodejs-16:${HCI_IMAGE_FLAVOR}-0.2.2"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/nodejs-16-minimal:${HCI_IMAGE_FLAVOR}-0.2.2"
  - id: "18"
    label: "18"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/nodejs-18:${HCI_IMAGE_FLAVOR}-0.2.2"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/nodejs-18-minimal:${HCI_IMAGE_FLAVOR}-0.2.2"
  - id: "20"
    label: "20"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/ubi9/nodejs-20:9.7-1776920053"
    runtime: "${HCI_REGISTRY_OCI_HOST}/ubi9/nodejs-20-minimal:9.7-1776863660"
  - id: "22"
    label: "22"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/ubi9/nodejs-22:9.7-1776920122"
    runtime: "${HCI_REGISTRY_OCI_HOST}/ubi9/nodejs-22-minimal:9.7-1776863671"
images:
  sonar: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/node.sonar:2.35.0"
  svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-nodejs-0.7.0"
ports: [3000, 8443]
schema:
  name: NodeJS
cache:
  files: [package-lock.json, pnpm-lock.yaml]
  paths: [.cache/npm, node_modules]
artifacts: [build, package.json, package-lock.json, yarn.lock, pnpm-lock.yaml]
reports:
  coverage:
    format: cobertura
    path: coverage/cobertura-coverage.xml
