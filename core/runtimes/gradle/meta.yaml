name: gradle
title: Java (Gradle)
description: Gradle-проекты (wrapper или системный gradle).
default_version: "21"
service_types: [image, library]
steps: [build, test, publish, image:build, image:scan, image:publish, cd:bump, cd:notify, deps:scan, sonar, svace, appscreener, kcs]
versions:
  - id: "8"
    label: "8"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-8-gradle:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-8-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
    svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-gradle-8-0.7.0"
  - id: "11"
    label: "11"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-11-gradle:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-11-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
    svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-gradle-11-0.7.0"
  - id: "17"
    label: "17"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-17-gradle:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-17-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
    svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-gradle-17-0.7.0"
  - id: "21"
    label: "21"
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-21-gradle:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-21-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
    svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-gradle-21-0.7.0"
  - id: "25"
    label: "25"
    flavors: [ubi9]
    build: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-25-gradle:${HCI_IMAGE_FLAVOR}-0.4.4"
    runtime: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/openjdk-25-runtime:${HCI_IMAGE_FLAVOR}-0.4.4"
    svace: "${HCI_REGISTRY_OCI_HOST}/${HCI_IMAGES_FOLDER}/svace:${HCI_IMAGE_FLAVOR}-svace-gradle-25-0.7.0"
images:
  sonar: build
ports: [8080, 8443]
schema:
  name: JDK
  buildTool: gradle
cache:
  files: [gradle.lockfile, gradle/libs.versions.toml]
  paths: [.cache/gradle]
artifacts: [build/libs, build.gradle, build.gradle.kts, gradle.lockfile]
reports:
  junit: ["**/build/test-results/test/TEST-*.xml"]
  coverage:
    format: jacoco
    path: "**/build/reports/jacoco/test/jacocoTestReport.xml"
