# Сгенерировано tools/generate.py из core/runtimes/*/meta.yaml. Не редактировать вручную.
- template:
    flow: image
    fileName: templates/image.yml
    component: image
    imageBuildTool:
      name: Buildah
- template:
    flow: image
    fileName: templates/image.yml
    component: image
    imageBuildTool:
      name: CEKit
    withDockerfile: false
    inputs:
      image_build_mode: cekit
- template:
    flow: standard
    fileName: templates/bun.yml
    component: bun
    runtime:
      name: Bun
      versions: &id001
      - "1"
      portProtocol:
      - port: 3000
        protocol: TCP
      - port: 8443
        protocol: TCP
    inputs:
      service_type: image
- template:
    flow: library
    fileName: templates/bun.yml
    component: bun
    runtime:
      name: Bun
      versions: *id001
    inputs:
      service_type: library
