name: Hyperion CI step
description: Runs a Hyperion CI core step (ci <step>). The image must contain /opt/ci, or set ci-bin.
author: Hyperion

inputs:
  step:
    description: "Core step: build, test, lint, publish, image:build, image:scan, image:publish, deps:scan, sonar, svace, appscreener, kcs, helm:lint, helm:publish, cd:bump, cd:notify, ..."
    required: true
  workdir:
    description: Project directory relative to the repository root
    required: false
    default: "."
  runtime:
    description: Runtime (maven, gradle, nodejs, …). Empty — auto-detect / .ci.yaml
    required: false
    default: ""
  runtime-version:
    description: Runtime version
    required: false
    default: ""
  service-type:
    description: image or library
    required: false
    default: ""
  profile:
    description: Runtime profile (e.g. quarkus)
    required: false
    default: ""
  strict:
    description: "false — soft steps don't fail the job (code 78 → warning)"
    required: false
    default: "true"
  ci-bin:
    description: Path to the ci binary (defaults to ci from PATH / /opt/ci/bin)
    required: false
    default: "ci"
  args:
    description: "Extra space-separated ci arguments (--image-build-mode=dockerfile …)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: ci ${{ inputs.step }}
      shell: bash
      env:
        HCI_CI_BIN: ${{ inputs.ci-bin }}
        HCI_WORKDIR: ${{ inputs.workdir }}
        HCI_RUNTIME: ${{ inputs.runtime }}
        HCI_RUNTIME_VERSION: ${{ inputs.runtime-version }}
        HCI_SERVICE_TYPE: ${{ inputs.service-type }}
        HCI_PROFILE: ${{ inputs.profile }}
        HCI_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        runner="${GITHUB_ACTION_PATH}/run-step.sh"
        [[ -x "$runner" ]] || runner="${GITHUB_ACTION_PATH}/../common/run-step.sh"
        chmod +x "$runner" 2>/dev/null || true
        # Empty inputs must not override .ci.yaml / defaults.
        unset_if_empty() { [[ -n "${!1}" ]] || unset "$1"; }
        unset_if_empty HCI_RUNTIME
        unset_if_empty HCI_RUNTIME_VERSION
        unset_if_empty HCI_SERVICE_TYPE
        unset_if_empty HCI_PROFILE
        # shellcheck disable=SC2086
        exec "$runner" "${{ inputs.step }}" ${{ inputs.args }}
