# Сгенерировано tools/generate.py из core/runtimes/*/meta.yaml. Не редактировать вручную.
spec:
  inputs:
    job_prefix:
      default: ""
      description: "Префикс имён джобов: несколько компонентов в одном пайплайне (монорепозиторий, матрица версий)"
    workdir:
      default: .
      description: Каталог проекта относительно корня репозитория
    strict:
      type: boolean
      default: true
      description: false — падение мягких шагов (тесты, линтеры, анализы) не блокирует пайплайн
    runner_tag:
      default: "$RUNNER_TAG"
      description: Тег раннера
    registry_host:
      default: "$NEXUS_HOST"
      description: Реестр, из которого берутся образы джобов
    push_registry_host:
      default: ""
      description: Реестр публикации образов (пусто — REGISTRY_INT_HOST или registry_host)
    images_folder:
      default: "$DST_STORAGE_FOLDER"
      description: Каталог образов платформы в реестре
    image_flavor:
      default: ubi9
      options:
      - ubi9
      - redos73-cert
      description: Базовая ОС образов
    core_version:
      default: 1.0.0
      description: Версия ядра ci (тег обёрточных образов)
    ci_bin:
      default: ci
      description: Команда ядра (для e2e репозитория шаблонов — путь к core/bin/ci)
    tools_image:
      default: "$HCI_TOOLS_IMAGE_AUTO"
      description: Образ для шагов образа и анализов
    stage_publish:
      default: deploy
      description: Stage для шагов publish
    runtime_version:
      default: '22'
      options:
      - '10'
      - '12'
      - '14'
      - '16'
      - '18'
      - '20'
      - '22'
      description: Версия рантайма
    service_type:
      default: image
      options:
      - image
      - library
      description: image — сервис с образом, library — библиотека
    image_build_mode:
      default: auto
      options:
      - auto
      - base
      - dockerfile
      - s2i
      - cekit
      description: Режим сборки образа
    image_platforms:
      default: linux/amd64
      description: Платформы образа через запятую (multi-arch)
    runtime_image:
      default: ""
      description: Базовый образ приложения (пусто — из meta.yaml для runtime_version)
---
"$[[ inputs.job_prefix ]]image:publish":
  tags:
  - "$[[ inputs.runner_tag ]]"
  interruptible: false
  variables:
    HCI_RUNTIME: nodejs
    HCI_STRICT: "$[[ inputs.strict ]]"
    HCI_WORKDIR: "$[[ inputs.workdir ]]"
    HCI_IMAGE_FLAVOR: "$[[ inputs.image_flavor ]]"
    HCI_IMAGES_FOLDER: "$[[ inputs.images_folder ]]"
    HCI_REGISTRY_OCI_PUSH_HOST: "$[[ inputs.push_registry_host ]]"
    HCI_TOOLS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-tools:$[[ inputs.image_flavor ]]-1.7.0-ci$[[ inputs.core_version ]]"
    HCI_KCS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-images-scanner:v2.1.1-with-db-ci$[[ inputs.core_version ]]"
    HCI_CI_BIN: "$[[ inputs.ci_bin ]]"
    GIT_DEPTH: '1'
    HCI_SERVICE_TYPE: "$[[ inputs.service_type ]]"
    HCI_IMAGE_BUILD_MODE: "$[[ inputs.image_build_mode ]]"
    HCI_IMAGE_PLATFORMS: "$[[ inputs.image_platforms ]]"
    HCI_RUNTIME_IMAGE: "$[[ inputs.runtime_image ]]"
    HCI_RUNTIME_VERSION: "$[[ inputs.runtime_version ]]"
    HCI_BUILD_IMAGE_10: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-ubi8-nodejs-10:1-127-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_12: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-ubi8-nodejs-12:1-113-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_14: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-ubi8-nodejs-14:1-111-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_16: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-nodejs-16:$[[ inputs.image_flavor ]]-0.2.2-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_18: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-nodejs-18:$[[ inputs.image_flavor ]]-0.2.2-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_20: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-ubi9-nodejs-20:9.7-1776920053-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_22: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-ubi9-nodejs-22:9.7-1776920122-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_AUTO: "$HCI_BUILD_IMAGE_$[[ inputs.runtime_version ]]"
    HCI_SONAR_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-node.sonar:2.35.0-ci$[[ inputs.core_version ]]"
    HCI_SVACE_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-svace:$[[ inputs.image_flavor ]]-svace-nodejs-0.7.0-ci$[[ inputs.core_version ]]"
  cache:
    key:
      prefix: nodejs-$[[ inputs.runtime_version ]]
      files:
      - "$[[ inputs.workdir ]]/package-lock.json"
      - "$[[ inputs.workdir ]]/pnpm-lock.yaml"
    paths:
    - "$[[ inputs.workdir ]]/.cache/npm"
    - "$[[ inputs.workdir ]]/node_modules"
    policy: pull
  stage: "$[[ inputs.stage_publish ]]"
  image: "$[[ inputs.tools_image ]]"
  needs:
  - job: "$[[ inputs.job_prefix ]]image:build"
    artifacts: true
    optional: true
  - job: "$[[ inputs.job_prefix ]]image:scan"
    artifacts: true
    optional: true
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} image:publish"
  artifacts:
    paths:
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    expire_in: never
  rules:
  - if: "$CI_COMMIT_TAG"
