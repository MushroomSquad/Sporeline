# Generated by tools/generate.py from core/runtimes/*/meta.yaml. Do not edit by hand.
spec:
  description: "Analysis without a build: dependencies, SonarQube, Svace, appScreener."
  inputs:
    job_prefix:
      default: ""
      description: "Job name prefix: several components in one pipeline (monorepo, version matrix)"
    workdir:
      default: .
      description: Project directory relative to the repository root
    strict:
      type: boolean
      default: true
      description: false — a soft step failing (tests, linters, analysis) doesn't block the pipeline
    runner_tag:
      default: "$RUNNER_TAG"
      description: Runner tag
    registry_host:
      default: "$NEXUS_HOST"
      description: Registry the job images are pulled from
    push_registry_host:
      default: ""
      description: Registry to publish images to (empty — REGISTRY_INT_HOST or registry_host)
    images_folder:
      default: "$DST_STORAGE_FOLDER"
      description: Platform image folder in the registry
    image_flavor:
      default: ubi9
      options:
      - ubi9
      - redos73-cert
      description: Base OS of the images
    core_version:
      default: 1.0.0
      description: Core (ci) version — the wrapper images' tag
    ci_bin:
      default: ci
      description: Core command (for the templates repo's own e2e — path to core/bin/ci)
    tools_image:
      default: "$HCI_TOOLS_IMAGE_AUTO"
      description: Image for image and analysis steps
    stage_test:
      default: test
      description: Stage for the test steps
    deps_scan:
      type: boolean
      default: true
      description: Dependency analysis
    sonar:
      type: boolean
      default: false
      description: SonarQube
    svace:
      type: boolean
      default: false
      description: Svace
    appscreener:
      type: boolean
      default: false
      description: Solar appScreener
    appscreener_runner_tag:
      default: "$RUNNER_TAG"
      description: Runner tag for appScreener
    sonar_image:
      default: "$HCI_SONAR_IMAGE_AUTO"
      description: Image with sonar-scanner
    svace_image:
      default: "$HCI_SVACE_IMAGE_AUTO"
      description: Svace image with build tools
    svace_build_cmd:
      default: ""
      description: Build command for Svace
---
.$[[ inputs.job_prefix ]]hci-analyze:
  tags:
  - "$[[ inputs.runner_tag ]]"
  interruptible: true
  variables:
    HCI_RUNTIME: none
    HCI_STRICT: "$[[ inputs.strict ]]"
    HCI_WORKDIR: "$[[ inputs.workdir ]]"
    HCI_IMAGE_FLAVOR: "$[[ inputs.image_flavor ]]"
    HCI_IMAGES_FOLDER: "$[[ inputs.images_folder ]]"
    HCI_REGISTRY_OCI_PUSH_HOST: "$[[ inputs.push_registry_host ]]"
    HCI_TOOLS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-tools:$[[ inputs.image_flavor ]]-1.7.0-ci$[[ inputs.core_version ]]"
    HCI_KCS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-images-scanner:v2.1.1-with-db-ci$[[ inputs.core_version ]]"
    HCI_CI_BIN: "$[[ inputs.ci_bin ]]"
    GIT_DEPTH: '1'
    HCI_SONAR_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-node.sonar:2.35.0-ci$[[ inputs.core_version ]]"
    HCI_SVACE_IMAGE_AUTO: ""
    HCI_SVACE_BUILD_CMD: "$[[ inputs.svace_build_cmd ]]"
"$[[ inputs.job_prefix ]]deps:scan":
  extends: .$[[ inputs.job_prefix ]]hci-analyze
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.tools_image ]]"
  variables:
    HCI_JOB_ENABLED: "$[[ inputs.deps_scan ]]"
  needs: []
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} deps:scan"
  artifacts:
    when: always
    paths:
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    expire_in: 1 week
  rules:
  - if: "$HCI_JOB_ENABLED == \"true\""
  allow_failure:
    exit_codes:
    - 78
"$[[ inputs.job_prefix ]]sonar":
  extends: .$[[ inputs.job_prefix ]]hci-analyze
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.sonar_image ]]"
  variables:
    HCI_JOB_ENABLED: "$[[ inputs.sonar ]]"
    GIT_DEPTH: '0'
  needs: []
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} sonar"
  rules:
  - if: "$HCI_JOB_ENABLED == \"true\""
  allow_failure:
    exit_codes:
    - 78
"$[[ inputs.job_prefix ]]svace":
  extends: .$[[ inputs.job_prefix ]]hci-analyze
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.svace_image ]]"
  variables:
    HCI_JOB_ENABLED: "$[[ inputs.svace ]]"
    GIT_DEPTH: '0'
  needs: []
  script:
