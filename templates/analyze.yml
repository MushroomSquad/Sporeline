  - "${HCI_CI_BIN:-ci} svace"
  artifacts:
    when: always
    paths:
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    expire_in: 1 week
  rules:
  - if: "$HCI_JOB_ENABLED == \"true\""
  allow_failure:
    exit_codes:
    - 78
"$[[ inputs.job_prefix ]]appscreener":
  extends: .$[[ inputs.job_prefix ]]hci-analyze
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.tools_image ]]"
