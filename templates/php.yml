# Generated by tools/generate.py from core/runtimes/*/meta.yaml. Do not edit by hand.
spec:
  description: PHP. Composer + s2i (ubi php). Tests via PHPUnit.
  inputs:
    job_prefix:
      default: ""
      description: "Job name prefix: several components in one pipeline (monorepo, version matrix)"
    workdir:
      default: .
      description: Project directory relative to the repository root
    strict:
      type: boolean
      default: true
      description: false — a soft step failing (tests, linters, analysis) doesn't block the pipeline
    runner_tag:
      default: "$RUNNER_TAG"
      description: Runner tag
    registry_host:
      default: "$NEXUS_HOST"
      description: Registry the job images are pulled from
    push_registry_host:
      default: ""
      description: Registry to publish images to (empty — REGISTRY_INT_HOST or registry_host)
    images_folder:
      default: "$DST_STORAGE_FOLDER"
      description: Platform image folder in the registry
    image_flavor:
      default: ubi9
      options:
      - ubi9
      - redos73-cert
      description: Base OS of the images
    core_version:
      default: 1.0.0
      description: Core (ci) version — the wrapper images' tag
    ci_bin:
      default: ci
      description: Core command (for the templates repo's own e2e — path to core/bin/ci)
    tools_image:
      default: "$HCI_TOOLS_IMAGE_AUTO"
      description: Image for image and analysis steps
    stage_build:
      default: build
      description: Stage for the build steps
    stage_test:
      default: test
      description: Stage for the test steps
    stage_publish:
      default: deploy
      description: Stage for the publish steps
    runtime_version:
      default: '83'
      options:
      - '73'
      - '74'
      - '80'
      - '81'
      - '82'
      - '83'
      description: Runtime version
    service_type:
      default: image
      options:
      - image
      description: image — a service with an image, library — a library
    build_image:
      default: "$HCI_BUILD_IMAGE_AUTO"
      description: Build image (defaults to the one for runtime_version)
    image_build_mode:
      default: auto
      options:
      - auto
      - base
      - dockerfile
      - s2i
      - cekit
      description: Image build mode
    image_platforms:
      default: linux/amd64
      description: Comma-separated image platforms (multi-arch)
    runtime_image:
      default: ""
      description: Base application image (empty — taken from meta.yaml for runtime_version)
    test:
      type: boolean
      default: true
      description: Unit tests
    image_build:
      type: boolean
      default: true
      description: Build the image
    image_scan:
      type: boolean
      default: true
      description: Trivy image analysis
    image_publish:
      type: boolean
      default: true
      description: Publish the image (on tag; override rules in the project)
    cd_bump:
      type: boolean
      default: false
      description: Bump the image in the GitOps manifest (git commit+push)
    cd_notify:
      type: boolean
      default: false
      description: Webhook trigger for the GitOps controller (ArgoCD/Flux)
    deps_scan:
      type: boolean
      default: true
      description: Dependency analysis
    sonar:
      type: boolean
      default: false
      description: SonarQube
    appscreener:
      type: boolean
      default: false
      description: Solar appScreener
    kcs:
      type: boolean
      default: false
      description: Kaspersky Container Security
    appscreener_runner_tag:
      default: "$RUNNER_TAG"
      description: Runner tag for appScreener
    kcs_runner_tag:
      default: hyperion-kcs
      description: Runner tag for KCS
---
.$[[ inputs.job_prefix ]]hci-php:
  tags:
  - "$[[ inputs.runner_tag ]]"
  interruptible: true
  variables:
    HCI_RUNTIME: php
    HCI_STRICT: "$[[ inputs.strict ]]"
    HCI_WORKDIR: "$[[ inputs.workdir ]]"
    HCI_IMAGE_FLAVOR: "$[[ inputs.image_flavor ]]"
    HCI_IMAGES_FOLDER: "$[[ inputs.images_folder ]]"
    HCI_REGISTRY_OCI_PUSH_HOST: "$[[ inputs.push_registry_host ]]"
    HCI_TOOLS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-tools:$[[ inputs.image_flavor ]]-1.7.0-ci$[[ inputs.core_version ]]"
    HCI_KCS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-images-scanner:v2.1.1-with-db-ci$[[ inputs.core_version ]]"
    HCI_CI_BIN: "$[[ inputs.ci_bin ]]"
    GIT_DEPTH: '1'
    HCI_SERVICE_TYPE: "$[[ inputs.service_type ]]"
    HCI_IMAGE_BUILD_MODE: "$[[ inputs.image_build_mode ]]"
    HCI_IMAGE_PLATFORMS: "$[[ inputs.image_platforms ]]"
    HCI_RUNTIME_IMAGE: "$[[ inputs.runtime_image ]]"
    HCI_RUNTIME_VERSION: "$[[ inputs.runtime_version ]]"
    HCI_BUILD_IMAGE_73: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-php-73:ubi7-0.0.1-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_74: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-php-74:ubi8-0.0.1-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_80: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-php-80:$[[ inputs.image_flavor ]]-0.0.1-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_81: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-php-81:$[[ inputs.image_flavor ]]-0.0.1-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_82: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-php-82:$[[ inputs.image_flavor ]]-0.0.1-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_83: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-php-83:$[[ inputs.image_flavor ]]-0.0.1-ci$[[ inputs.core_version ]]"
    HCI_BUILD_IMAGE_AUTO: "$HCI_BUILD_IMAGE_$[[ inputs.runtime_version ]]"
    HCI_SONAR_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-node.sonar:2.35.0-ci$[[ inputs.core_version ]]"
  cache:
    key: &id001
      prefix: php-$[[ inputs.runtime_version ]]
      files:
      - "$[[ inputs.workdir ]]/composer.lock"
      - "$[[ inputs.workdir ]]/composer.json"
    paths: &id002
    - "$[[ inputs.workdir ]]/.cache/composer"
    policy: pull
"$[[ inputs.job_prefix ]]build":
  extends: .$[[ inputs.job_prefix ]]hci-php
  stage: "$[[ inputs.stage_build ]]"
  image: "$[[ inputs.build_image ]]"
  needs: []
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} build"
  cache:
    key: *id001
    paths: *id002
    policy: pull-push
  artifacts:
    paths:
    - "$[[ inputs.workdir ]]/composer-build"
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    expire_in: 1 day
"$[[ inputs.job_prefix ]]test":
  extends: .$[[ inputs.job_prefix ]]hci-php
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.build_image ]]"
  variables:
    HCI_JOB_ENABLED: "$[[ inputs.test ]]"
  needs:
  - job: "$[[ inputs.job_prefix ]]build"
    artifacts: true
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} test"
  artifacts:
    when: always
    paths:
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    reports:
      junit:
      - "$[[ inputs.workdir ]]/phpunit-report.xml"
    expire_in: 1 week
  rules:
  - if: "$HCI_JOB_ENABLED == \"true\""
  allow_failure:
    exit_codes:
    - 78
"$[[ inputs.job_prefix ]]deps:scan":
  extends: .$[[ inputs.job_prefix ]]hci-php
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.tools_image ]]"
  variables:
    HCI_JOB_ENABLED: "$[[ inputs.deps_scan ]]"
  needs: []
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} deps:scan"
  artifacts:
    when: always
    paths:
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    expire_in: 1 week
  rules:
  - if: "$HCI_JOB_ENABLED == \"true\""
  allow_failure:
    exit_codes:
    - 78
"$[[ inputs.job_prefix ]]sonar":
  extends: .$[[ inputs.job_prefix ]]hci-php
  stage: "$[[ inputs.stage_test ]]"
  image: "$HCI_SONAR_IMAGE_AUTO"
  variables:
    HCI_JOB_ENABLED: "$[[ inputs.sonar ]]"
    GIT_DEPTH: '0'
  needs:
  - job: "$[[ inputs.job_prefix ]]build"
    artifacts: true
  - job: "$[[ inputs.job_prefix ]]test"
    artifacts: true
    optional: true
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} sonar"
  rules:
  - if: "$HCI_JOB_ENABLED == \"true\""
  allow_failure:
    exit_codes:
    - 78
"$[[ inputs.job_prefix ]]appscreener":
  extends: .$[[ inputs.job_prefix ]]hci-php
  stage: "$[[ inputs.stage_test ]]"
  image: "$[[ inputs.tools_image ]]"
