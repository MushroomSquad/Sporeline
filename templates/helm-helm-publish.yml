# Generated by tools/generate.py from core/runtimes/*/meta.yaml. Do not edit by hand.
spec:
  inputs:
    job_prefix:
      default: ""
      description: "Job name prefix: several components in one pipeline (monorepo, version matrix)"
    workdir:
      default: .
      description: Project directory relative to the repository root
    strict:
      type: boolean
      default: true
      description: false — a soft step failing (tests, linters, analysis) doesn't block the pipeline
    runner_tag:
      default: "$RUNNER_TAG"
      description: Runner tag
    registry_host:
      default: "$NEXUS_HOST"
      description: Registry the job images are pulled from
    push_registry_host:
      default: ""
      description: Registry to publish images to (empty — REGISTRY_INT_HOST or registry_host)
    images_folder:
      default: "$DST_STORAGE_FOLDER"
      description: Platform image folder in the registry
    image_flavor:
      default: ubi9
      options:
      - ubi9
      - redos73-cert
      description: Base OS of the images
    core_version:
      default: 1.0.0
      description: Core (ci) version — the wrapper images' tag
    ci_bin:
      default: ci
      description: Core command (for the templates repo's own e2e — path to core/bin/ci)
    tools_image:
      default: "$HCI_TOOLS_IMAGE_AUTO"
      description: Image for image and analysis steps
    stage_publish:
      default: deploy
      description: Stage for the publish steps
    chart_dir:
      default: .
      description: Chart directory relative to workdir
    values:
      default: values.yaml
      description: Comma-separated values files to check
    publish_mode:
      default: nexus
      options:
      - nexus
      - oci
      description: Where to publish the chart
---
"$[[ inputs.job_prefix ]]helm:publish":
  tags:
  - "$[[ inputs.runner_tag ]]"
  interruptible: false
  image: "$[[ inputs.tools_image ]]"
  variables:
    HCI_RUNTIME: none
    HCI_STRICT: "$[[ inputs.strict ]]"
    HCI_WORKDIR: "$[[ inputs.workdir ]]"
    HCI_IMAGE_FLAVOR: "$[[ inputs.image_flavor ]]"
    HCI_IMAGES_FOLDER: "$[[ inputs.images_folder ]]"
    HCI_REGISTRY_OCI_PUSH_HOST: "$[[ inputs.push_registry_host ]]"
    HCI_TOOLS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-tools:$[[ inputs.image_flavor ]]-1.7.0-ci$[[ inputs.core_version ]]"
    HCI_KCS_IMAGE_AUTO: "$[[ inputs.registry_host ]]/$[[ inputs.images_folder ]]/ci-images-scanner:v2.1.1-with-db-ci$[[ inputs.core_version ]]"
    HCI_CI_BIN: "$[[ inputs.ci_bin ]]"
    GIT_DEPTH: '1'
    HCI_HELM_CHART_DIR: "$[[ inputs.chart_dir ]]"
    HCI_HELM_VALUES: "$[[ inputs.values ]]"
    HCI_HELM_PUBLISH_MODE: "$[[ inputs.publish_mode ]]"
  stage: "$[[ inputs.stage_publish ]]"
  needs:
  - job: "$[[ inputs.job_prefix ]]helm:lint"
    artifacts: false
    optional: true
  script:
  - export PATH="${HCI_CI_BIN%/*}:/opt/ci/bin:$PATH"
  - "${HCI_CI_BIN:-ci} helm:publish"
  artifacts:
    paths:
    - "$[[ inputs.workdir ]]/hci-artifacts/"
    expire_in: never
  rules:
  - if: "$CI_COMMIT_TAG"
